# Course settings, read by build.py.
# After editing, rebuild the site:   cd _build && python build.py
# (and re-run export.py + make_pptx.js if you also want fresh PDF/PPTX downloads)

# Arabic subtitles on the title, section and closing slides.
# false = English only: the Arabic text and the Arabic web font are left out of the build.
arabic = false

# Course title: title slide, browser tab, contents panel and PPTX. The first " for " splits it
# over two lines on the title slide.
title = "AI for Earth Observation"

# Shown on the title slide; also written as the author of the PPTX.
instructor = "Chouaib El Hachimi"

# Title slide: position under the name, numbered affiliations, and the portrait shown in the
# arch (path relative to the site root; "" shows the zellige rosette instead).
position = "Postdoctoral Fellow"
affiliations = [
  "The Research Centre for Artificial Intelligence in Geomatics, The Hong Kong Polytechnic University",
  "JC STEM Lab of Earth Observations, Department of Land Surveying and Geospatial Science, The Hong Kong Polytechnic University",
]
photo = "assets/img/instructor.jpg"

# Slides to leave out of the deck (and of the PDF/PPTX). Numbers are the slide numbers you
# see in the deck built with hide_pages = [] (after the [modules] below are applied); the
# remaining slides are renumbered. Ranges and exact slide titles also work:
#   hide_pages = [1, 2, 14]      hide_pages = "1,2,14"      hide_pages = ["20-25", "Break"]
hide_pages = ["109", "98", "119-140", "7", "14-16", "26", "29-32", "45-46", "48", "60-62", "66-67", "75-80", "113-115"]

# The two main accent colours (hex). They replace the terracotta red and the zellige green
# everywhere: headings, tags, cards, code cards, the live demos and the SVG figures and motifs.
# Default: the red and green of the Moroccan flag. The original palette was
# primary = "#B5502E" (terracotta), secondary = "#0F6B5C" (zellige green).
[theme]
primary = "#C1272D"
secondary = "#006233"

# Optional teaching blocks. Switching one off removes its slides, its lines on the
# course map and section slides, and its minutes from the schedule. unsupervised and
# reinforcement remove a whole part (III, IV); tabular_fm removes Chapter V.8.
[modules]
classical_ml = true      # Part II   · naive Bayes, decision trees, bagging & random forests, boosting, SVM (live demos)
eo_data = true           # Part II   · analysis-ready data, clouds & compositing, labels; tiles & normalisation in V.2 (2 demos)
evaluation = true        # Part II   · spatial cross-validation, rare-class metrics, area estimation, protocol (3 demos)
unsupervised = true      # Part III  · k-means, image clustering, Gaussian mixtures & EM, DBSCAN, PCA, Lab 2 (live demos)
reinforcement = true     # Part IV   · MDPs & value iteration, Q-learning, bandits, Lab 3, deep RL & RLHF (live demos)
cv_fundamentals = true   # Ch. V.2   · pixels, RGB / multispectral / hyperspectral, grayscale, thresholding,
                         #             convolution step by step, filtering, SAR speckle filtering (live demos)
detection = true         # Ch. V.2   · object detection: anchors, IoU, NMS, average precision, large scenes (1 demo)
fusion = true            # Ch. V.2   · SAR + optical fusion, mapping under clouds (1 demo)
physics_ml = true        # Ch. V.7   · physics + ML, emulators and hybrid LAI retrieval (1 demo)
tabular_fm = true        # Ch. V.8   · tabular foundation models: in-context learning, TabArena, scoring rules (3 demos)
trustworthy = true       # Ch. V.9   · calibration, ensemble uncertainty, explanations, domain shift (4 demos)
responsible_ai = true    # Ch. V.9   · geographic bias, carbon footprint, privacy & documentation (2 demos)

# Minutes per part (and per chapter of Part V), in teaching order. Section-slide times,
# the course map and the total duration ("6½-hour course") are computed from these numbers.
# A part or chapter whose divider is switched off by a module does not count.
[schedule]
opening = 5
I = 25
II = 25
III = 25                 # whole part requires unsupervised
IV = 25                  # whole part requires reinforcement
break = 15
V = 30                   # V.1 foundations: rise of deep learning, neuron, gradient descent, back-prop, MLP
V2 = 20
V3 = 12
V4 = 10
V5 = 15
break2 = 10
V6 = 20
V7 = 15
V8 = 20                  # whole chapter requires tabular_fm
V9 = 0
V10 = 15
wrap = 3

# Extra minutes added to a part when its optional block is switched on.
[schedule.modules]
classical_ml = 15        # added to Part II
eo_data = 10             # added to Part II
evaluation = 15          # added to Part II
cv_fundamentals = 15     # added to Chapter V.2
detection = 10           # added to Chapter V.2
fusion = 10              # added to Chapter V.2
physics_ml = 10          # added to Chapter V.7
trustworthy = 15         # added to Chapter V.9
responsible_ai = 10      # added to Chapter V.9
