# Course settings, read by build.py.
# After editing, rebuild the site:   cd _build && python build.py
# (and re-run export.py + make_pptx.js if you also want fresh PDF/PPTX downloads)

# Arabic subtitles on the title, section and closing slides.
# false = English only: the Arabic text and the Arabic web font are left out of the build.
arabic = false

# Course title: title slide, browser tab, contents panel and PPTX. The first " for " splits it
# over two lines on the title slide.
title = "AI for Earth Observation"

# Shown on the title slide; also written as the author of the PPTX.
instructor = "Chouaib El Hachimi"

# Title slide: position under the name, numbered affiliations, and the portrait shown in the
# arch (path relative to the site root; "" shows the zellige rosette instead).
position = "Postdoctoral Fellow"
affiliations = [
  "The Research Centre for Artificial Intelligence in Geomatics, The Hong Kong Polytechnic University",
  "JC STEM Lab of Earth Observations, Department of Land Surveying and Geospatial Science, The Hong Kong Polytechnic University",
]
photo = "assets/img/instructor.jpg"

# Slides to leave out of the deck (and of the PDF/PPTX). Numbers are the slide numbers you
# see in the deck built with hide_pages = [] (after the [modules] below are applied); the
# remaining slides are renumbered. Ranges and exact slide titles also work:
#   hide_pages = [1, 2, 14]      hide_pages = "1,2,14"      hide_pages = ["20-25", "Break"]
hide_pages = []

# The two main accent colours (hex). They replace the terracotta red and the zellige green
# everywhere: headings, tags, cards, code cards, the live demos and the SVG figures and motifs.
# Default: the red and green of the Moroccan flag. The original palette was
# primary = "#B5502E" (terracotta), secondary = "#0F6B5C" (zellige green).
[theme]
primary = "#C1272D"
secondary = "#006233"

# Optional teaching blocks. Switching one off removes its slides, its lines on the
# course map and section slides, and its minutes from the schedule.
[modules]
classical_ml = true      # Part I  · naive Bayes, decision trees, bagging & random forests, boosting, SVM (live demos)
unsupervised = true      # Part I  · k-means, unsupervised image classification, Gaussian mixtures & EM, DBSCAN, PCA (live demos)
reinforcement = true     # Part I  · MDPs & value iteration, Q-learning, bandits, deep RL & RLHF (live demos)
cv_fundamentals = true   # Part IV · pixels, RGB / multispectral / hyperspectral, grayscale, thresholding,
                         #           convolution step by step, filtering, SAR speckle filtering (live demos)
eo_data = true           # Part IV  · analysis-ready data, clouds & compositing, tiles & normalisation, labels (2 demos)
detection = true         # Part IV  · object detection: anchors, IoU, NMS, average precision, large scenes (1 demo)
fusion = true            # Part IV  · SAR + optical fusion, mapping under clouds (1 demo)
evaluation = true        # Part IV  · spatial cross-validation, rare-class metrics, area estimation, protocol (3 demos)
physics_ml = true        # Part VIII · physics + ML, emulators and hybrid LAI retrieval (1 demo)
tabular_fm = true        # Part VIII · tabular foundation models: in-context learning, TabArena, scoring rules (3 demos)
trustworthy = true       # Part VIII · calibration, ensemble uncertainty, explanations, domain shift (4 demos)
responsible_ai = true    # Part VIII · geographic bias, carbon footprint, privacy & documentation (2 demos)

# Minutes per part, in teaching order. Section-slide times, the course map and the
# total duration ("3½-hour course") are computed from these numbers.
[schedule]
opening = 10
I = 20
II = 10
III = 20
IV = 25
break = 10
V = 15
VI = 10
VII = 15
VIII = 20
IX = 17
wrap = 3

# Extra minutes added to a part when its optional block is switched on.
[schedule.modules]
classical_ml = 15        # added to Part I
unsupervised = 15        # added to Part I
reinforcement = 15       # added to Part I
cv_fundamentals = 15     # added to Part IV
eo_data = 15             # added to Part IV
detection = 10           # added to Part IV
fusion = 10              # added to Part IV
evaluation = 20          # added to Part IV
physics_ml = 10          # added to Part VIII
tabular_fm = 20          # added to Part VIII
trustworthy = 20         # added to Part VIII
responsible_ai = 10      # added to Part VIII
